[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "madchatter-local-bridge"
version = "0.1.0"
description = "MADchatter Local Bridge — local audio transcription companion (Streamlink + faster-whisper + WASAPI loopback)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "MADchatter" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "faster-whisper>=1.0.3",
    "numpy>=1.26.0",
    "streamlink>=6.7.0",
]

[project.optional-dependencies]
wasapi = ["PyAudioWPatch>=0.2.14"]
gpu = ["ctranslate2[cuda]>=4.4.0"]
test = ["httpx>=0.27.0", "pytest>=8.0.0"]

[project.scripts]
madchatter-local = "madchatter_bridge.__main__:main"

[tool.setuptools.packages.find]
include = ["madchatter_bridge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
