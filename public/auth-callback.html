<!DOCTYPE html>
<html>
<head><title>Twitch Auth Callback</title></head>
<body style="background:#0F0F12;color:#E0E0E6;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
  <div style="text-align:center;">
    <h2 id="status">Authenticating...</h2>
    <p>You can close this window.</p>
  </div>
  <script>
    (function() {
      var CLIENT_ID = "lxk6dndt1cv90fd1v8bn5fp6yh0f90";
      var hash = window.location.hash.substring(1);
      var hashParams = new URLSearchParams(hash);
      var queryParams = new URLSearchParams(window.location.search);
      var accessToken = hashParams.get('access_token') || queryParams.get('access_token');
      var error = hashParams.get('error') || queryParams.get('error');
      var errorDesc = hashParams.get('error_description') || queryParams.get('error_description');
      // Multi-bot: Twitch echoes back the `state` param we sent. Forward it so
      // the opener can route this token to the correct bot slot. Absent in
      // legacy single-bot logins (handled as before).
      var botState = hashParams.get('state') || queryParams.get('state') || null;

      console.log('[auth-callback] URL:', window.location.href);
      console.log('[auth-callback] hash:', hash);
      console.log('[auth-callback] search:', window.location.search);

      if (error) {
        document.getElementById('status').textContent = 'Authentication Failed: ' + (errorDesc || error);
        if (window.opener) {
          window.opener.postMessage({ type: 'OAUTH_ERROR', error: errorDesc || error, botState: botState }, '*');
        }
        setTimeout(function() { window.close(); }, 3000);
        return;
      }

      if (!accessToken) {
        document.getElementById('status').textContent = 'No token received — check console for URL details';
        if (window.opener) {
          window.opener.postMessage({ type: 'OAUTH_ERROR', error: 'No access token in callback. URL: ' + window.location.href, botState: botState }, '*');
        }
        setTimeout(function() { window.close(); }, 5000);
        return;
      }

      // Fetch user info from Twitch
      fetch('https://api.twitch.tv/helix/users', {
        headers: {
          'Authorization': 'Bearer ' + accessToken,
          'Client-Id': CLIENT_ID
        }
      })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data.data && data.data[0]) {
          var user = data.data[0];
          var session = {
            accessToken: accessToken,
            username: user.login,
            userId: user.id,
            profileImageUrl: user.profile_image_url
          };
          document.getElementById('status').textContent = 'Authentication Successful';
          if (window.opener) {
            window.opener.postMessage({ type: 'OAUTH_AUTH_SUCCESS', session: session, botState: botState }, '*');
          }
        } else {
          // Token valid but couldn't fetch user — store token with minimal info
          var session = {
            accessToken: accessToken,
            username: 'unknown',
            userId: 'unknown'
          };
          document.getElementById('status').textContent = 'Authentication Successful';
          if (window.opener) {
            window.opener.postMessage({ type: 'OAUTH_AUTH_SUCCESS', session: session, botState: botState }, '*');
          }
        }
        setTimeout(function() { window.close(); }, 1500);
      })
      .catch(function(e) {
        document.getElementById('status').textContent = 'Authentication Failed';
        if (window.opener) {
          window.opener.postMessage({ type: 'OAUTH_ERROR', error: 'Failed to fetch user info' }, '*');
        }
        setTimeout(function() { window.close(); }, 1500);
      });
    })();
  </script>
</body>
</html>
