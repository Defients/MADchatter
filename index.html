    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "AutoForge — AI Twitch Co-Pilot",
      "description": "An AI-powered Twitch co-pilot that generates high-signal chat messages in real time using stream context, transcription, and live chat analysis.",
      "url": "https://madchatter.fun/",

  </head>
  <body>
    <script>
      // Intercept Joystick OAuth callback before React loads (Joystick strips .html from redirect URL)
      (function() {
        var p = window.location.pathname;
        if (p === '/joystick-auth-callback' || p === '/joystick-auth-callback/') {
          var params = new URLSearchParams(window.location.search);
          var code = params.get('code');
          var state = params.get('state');
          var error = params.get('error');
          if (code) {
            localStorage.setItem('joystick_auth_callback', JSON.stringify({ code: code, state: state, ts: Date.now() }));
            document.title = 'Joystick Auth — Complete';
            document.body.innerHTML = '<div style="background:#0F0F12;color:#E0E0E6;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;"><div style="text-align:center;"><h2 style="color:#53fc18;">Authorization received</h2><p>You can close this window and return to the app.</p></div></div>';
            try { window.close(); } catch(e) {}
          } else if (error) {
            document.title = 'Joystick Auth — Failed';
            document.body.innerHTML = '<div style="background:#0F0F12;color:#E0E0E6;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;"><div style="text-align:center;"><h2 style="color:#ff6b6b;">Authentication Failed</h2><p>' + (params.get('error_description') || error) + '</p></div></div>';
          }
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
